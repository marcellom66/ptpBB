# BeaglePTP trusted local time policy: no public NTP pools.
# SHM 0 is the GNSS/NMEA time-of-day supplied by GPSD over USB.
refclock SHM 0:perm=0644 poll 2 filter 8 precision 0.1 delay 0.2 refid GNSS
# SHM 1 is PPS. It is preferred and locked to the GNSS second numbering.
refclock SHM 1:perm=0644 poll 2 filter 8 precision 1e-6 refid PPS lock GNSS prefer

driftfile /var/lib/chrony/chrony.drift
dumpdir /var/lib/chrony
rtcsync
makestep 0.1 3
maxupdateskew 100.0
leapsectz right/UTC
logdir /var/log/chrony
